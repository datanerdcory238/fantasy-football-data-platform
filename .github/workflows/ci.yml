name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: fantasy
          POSTGRES_USER: fantasy
          POSTGRES_PASSWORD: fantasy
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fantasy" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Unit + load tests
        run: pytest -q
      - name: Schema + SQL models apply cleanly on PostgreSQL
        run: python -m ffdata init-db
