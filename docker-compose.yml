# Local PostgreSQL for development.
#   Start:  docker compose up -d
#   Stop:   docker compose down        (data is kept in the named volume)
#   Reset:  docker compose down -v     (deletes all data)
services:
  db:
    image: postgres:16
    container_name: ffdata-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fantasy}
      POSTGRES_USER: ${POSTGRES_USER:-fantasy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fantasy}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fantasy} -d ${POSTGRES_DB:-fantasy}"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
